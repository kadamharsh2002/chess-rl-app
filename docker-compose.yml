version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: chess_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chessuser
      POSTGRES_PASSWORD: chesspass
      POSTGRES_DB: chessrl
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: